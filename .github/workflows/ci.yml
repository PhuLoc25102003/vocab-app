name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vocab
          POSTGRES_PASSWORD: vocab
          POSTGRES_DB: vocab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocab -d vocab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Chỉ dùng cho database tạm trong CI.
      DATABASE_URL: postgresql://vocab:vocab@localhost:5432/vocab
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chỉ chặn lỗ hổng của code chạy ở production. Công cụ phát triển do Dependabot theo dõi.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply migrations
        run: npm run prisma:deploy -w @vocab/api

      # Chạy tuần tự vì typecheck và build của API đều sinh lại Prisma Client.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vocab
          POSTGRES_PASSWORD: vocab
          POSTGRES_DB: vocab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocab -d vocab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Chỉ dùng cho database tạm trong CI.
      DATABASE_URL: postgresql://vocab:vocab@localhost:5432/vocab
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: apps/web/test-results
          retention-days: 7
